[tool:pytest]
testpaths = tests
addopts = --cov=. --cov-config=setup.cfg --cov-report=term-missing:skip-covered --cov-fail-under=50 -q

[coverage:run]
source = .
omit =
    tests/*
    database_pg.py
    main_old.py
    seed_sumulas.py

[coverage:report]
fail_under = 50
show_missing = true
skip_covered = true
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.
    pass
