<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login — ConcurseiroOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e1e2e">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    /* Page-specific: login */
    body { display: flex; align-items: center; justify-content: center; }
    .login-container { width: 100%; max-width: 400px; }
    .login-card { background: #313244; border-radius: 16px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); border: 1px solid #45475a; }
    .login-header { text-align: center; margin-bottom: 24px; }
    .login-header .logo { margin-bottom: 8px; display: inline-flex; }
    .login-header h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; background: linear-gradient(135deg, #cba6f7, #89b4fa); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: #cba6f7; }
    .login-header p { font-size: 0.85rem; color: #9399b2; }
    .btn { width: 100%; padding: 12px; font-size: 0.95rem; }
    .btn-primary { background: #cba6f7; color: #1e1e2e; }
    .btn-secondary { background: #45475a; color: #cdd6f4; margin-top: 8px; }
    .toggle-link { text-align: center; margin-top: 16px; font-size: 0.85rem; color: #9399b2; }
    .toggle-link a { color: #89b4fa; cursor: pointer; text-decoration: none; }
    .toggle-link a:hover { text-decoration: underline; }
    .code-input { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
    .code-input input { width: 45px; height: 52px; text-align: center; font-size: 1.5rem; font-weight: 700; border-radius: 8px; border: 2px solid #45475a; background: #1e1e2e; color: #a6e3a1; outline: none; }
    .code-input input:focus { border-color: #cba6f7; }
    .step { display: none; }
    .step.active { display: block; }
    .resend { text-align: center; margin-top: 12px; font-size: 0.8rem; color: #9399b2; }
    .resend a { color: #89b4fa; cursor: pointer; }
    .dev-code { text-align: center; margin-top: 8px; font-size: 0.8rem; padding: 8px; background: #1e1e2e; border-radius: 6px; color: #f9e2af; display: none; }
    .skip-link { display: block; text-align: center; margin-top: 16px; font-size: 0.82rem; color: #9399b2; }
    .skip-link:hover { color: #cdd6f4; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" width="56" height="56" role="img" aria-label="ConcurseiroOS"><rect width="32" height="32" rx="7" fill="#1e1e2e"/><polygon points="16,6 4,12 16,18 28,12" fill="#cba6f7"/><path d="M9,14 L9,20 Q16,24 23,20 L23,14 L16,18 Z" fill="#cba6f7" opacity="0.85"/><line x1="26" y1="12" x2="26" y2="20" stroke="#89b4fa" stroke-width="1.4" stroke-linecap="round"/><circle cx="26" cy="20.5" r="1.4" fill="#89b4fa"/></svg></div>
        <h1>ConcurseiroOS</h1>
        <p>Entre para salvar seu progresso</p>
      </div>

      <div id="msg" class="message" role="status" aria-live="polite"></div>

      <!-- STEP 1: Email -->
      <div id="step-email" class="step active">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" autofocus onkeydown="if(event.key==='Enter'){event.preventDefault();handleLogin();}">
        </div>
        <div class="form-group" id="nome-group" style="display:none;">
          <label for="nome">Nome (opcional)</label>
          <input type="text" id="nome" placeholder="Como quer ser chamado?" onkeydown="if(event.key==='Enter'){event.preventDefault();handleLogin();}">
        </div>
        <button class="btn btn-primary" id="btn-login" onclick="handleLogin()">Entrar</button>
        <div class="toggle-link">
          <span id="toggle-text">Não tem conta?</span> <a id="toggle-btn" onclick="toggleMode()">Criar conta</a>
        </div>
      </div>

      <!-- STEP 2: Código de verificação -->
      <div id="step-code" class="step">
        <p style="text-align:center;font-size:0.88rem;margin-bottom:4px;">Código enviado para:</p>
        <p style="text-align:center;font-size:0.82rem;color:var(--accent);margin-bottom:16px;" id="code-email-label"></p>
        <div class="code-input" id="code-inputs">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Dígito 1 do código">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Dígito 2 do código">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Dígito 3 do código">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Dígito 4 do código">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Dígito 5 do código">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" aria-label="Dígito 6 do código">
        </div>
        <button class="btn btn-primary" id="btn-verify" onclick="handleVerify()">Verificar</button>
        <button class="btn btn-secondary" onclick="goBackToEmail()">← Voltar</button>
        <div class="resend">Não recebeu? <a id="resend-link" onclick="handleResend()">Reenviar código</a></div>
        <div class="dev-code" id="dev-code"></div>
      </div>

      <!-- STEP 3: Sucesso -->
      <div id="step-success" class="step">
        <div style="text-align:center;padding:16px;">
          <div style="font-size:2.5rem;margin-bottom:8px;">🎉</div>
          <h2 style="color:var(--green);margin-bottom:8px;">Login realizado!</h2>
          <p style="font-size:0.85rem;color:var(--text-sub);">Redirecionando...</p>
        </div>
      </div>
    </div>
    <a href="/" style="display:inline-block;margin-top:16px;background:var(--accent);color:var(--bg);border-radius:8px;padding:8px 20px;font-weight:600;font-size:0.9rem;text-decoration:none;">🏠 Voltar ao Início</a>
  </div>

  <script>
    let mode = 'login'; // 'login' ou 'register'
    let currentEmail = '';

    // Se já está logado, redirecionar para home
    if (localStorage.getItem('auth_token')) {
      window.location.href = '/';
    }

    function toggleMode() {
      mode = mode === 'login' ? 'register' : 'login';
      const btn = document.getElementById('btn-login');
      const nomeGroup = document.getElementById('nome-group');
      const toggleText = document.getElementById('toggle-text');
      const toggleBtn = document.getElementById('toggle-btn');
      if (mode === 'register') {
        btn.textContent = 'Criar Conta';
        nomeGroup.style.display = 'block';
        toggleText.textContent = 'Já tem conta?';
        toggleBtn.textContent = 'Fazer login';
      } else {
        btn.textContent = 'Entrar';
        nomeGroup.style.display = 'none';
        toggleText.textContent = 'Não tem conta?';
        toggleBtn.textContent = 'Criar conta';
      }
      hideMsg();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    function hideMsg() {
      document.getElementById('msg').className = 'message';
    }

    function showStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.getElementById('step-' + step).classList.add('active');
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const nome = document.getElementById('nome').value.trim();
      if (!email || !email.includes('@')) { showMsg('Informe um email válido.', 'error'); return; }

      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Enviando...';
      hideMsg();

      try {
        const endpoint = mode === 'register' ? '/api/auth/register' : '/api/auth/login';
        const body = mode === 'register' ? { email, nome } : { email };
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(data.detail || 'Erro ao processar', 'error');
          btn.disabled = false;
          btn.textContent = mode === 'register' ? 'Criar Conta' : 'Entrar';
          return;
        }

        currentEmail = email;
        document.getElementById('code-email-label').textContent = email;

        // Em dev sem SMTP, código aparece no console do servidor
        if (!data.email_sent) {
          const devEl = document.getElementById('dev-code');
          devEl.style.display = 'block';
          devEl.textContent = '🔑 Código no console do servidor (SMTP não configurado)';
        }

        showStep('code');
        setupCodeInputs();
        showMsg(data.message, 'success');
      } catch(e) {
        showMsg('Erro de conexão com o servidor.', 'error');
      }

      btn.disabled = false;
      btn.textContent = mode === 'register' ? 'Criar Conta' : 'Entrar';
    }

    function setupCodeInputs() {
      const inputs = document.querySelectorAll('#code-inputs input');
      inputs.forEach((inp, i) => {
        inp.value = '';
        inp.addEventListener('input', (e) => {
          if (e.target.value && i < inputs.length - 1) inputs[i + 1].focus();
          // Auto-verify quando completar todos
          const code = [...inputs].map(x => x.value).join('');
          if (code.length === 6) setTimeout(handleVerify, 100);
        });
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && i > 0) inputs[i - 1].focus();
        });
        inp.addEventListener('paste', (e) => {
          e.preventDefault();
          const paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 6);
          paste.split('').forEach((ch, j) => { if (inputs[j]) inputs[j].value = ch; });
          if (paste.length === 6) setTimeout(handleVerify, 100);
        });
      });
      inputs[0].focus();
    }

    async function handleVerify() {
      const inputs = document.querySelectorAll('#code-inputs input');
      const code = [...inputs].map(x => x.value).join('');
      if (code.length !== 6) { showMsg('Preencha os 6 dígitos.', 'error'); return; }

      const btn = document.getElementById('btn-verify');
      btn.disabled = true;
      btn.textContent = 'Verificando...';
      hideMsg();

      try {
        const res = await fetch('/api/auth/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail, code })
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(data.detail || 'Código inválido', 'error');
          btn.disabled = false;
          btn.textContent = 'Verificar';
          return;
        }

        // Salvar token e dados do usuário
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', JSON.stringify(data.user));

        showStep('success');

        // Redirecionar
        setTimeout(() => { window.location.href = '/'; }, 1000);
      } catch(e) {
        showMsg('Erro de conexão.', 'error');
      }

      btn.disabled = false;
      btn.textContent = 'Verificar';
    }

    let resendCooldown = 0;
    let resendTimer = null;
    async function handleResend() {
      // Cooldown de 30s para evitar reenvios repetidos (rate limit no backend + UX).
      if (resendCooldown > 0) return;
      hideMsg();
      const link = document.getElementById('resend-link');
      const startCooldown = () => {
        resendCooldown = 30;
        const tick = () => {
          if (!link) return;
          if (resendCooldown > 0) {
            link.textContent = `Reenviar código (${resendCooldown}s)`;
            link.style.pointerEvents = 'none';
            link.style.opacity = '0.5';
            resendCooldown--;
            resendTimer = setTimeout(tick, 1000);
          } else {
            link.textContent = 'Reenviar código';
            link.style.pointerEvents = '';
            link.style.opacity = '';
          }
        };
        tick();
      };
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: currentEmail })
        });
        const data = await res.json();
        if (data.code) {
          document.getElementById('dev-code').style.display = 'block';
          document.getElementById('dev-code').textContent = '🔑 Código (dev): ' + data.code;
        }
        showMsg('Novo código enviado!', 'success');
        startCooldown();
      } catch(e) {
        showMsg('Erro ao reenviar.', 'error');
      }
    }

    function goBackToEmail() {
      showStep('email');
      hideMsg();
      document.getElementById('dev-code').style.display = 'none';
    }

    // Se já está logado, redirecionar
    if (localStorage.getItem('auth_token')) {
      window.location.href = '/';
    }
  </script>
</body>
</html>
