<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Domínio — ConcurseiroOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e1e2e">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    /* Page-specific: mastery */
    .header { flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 1.5rem; }

    /* Filters */
    .filters-bar {
      display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;
    }
    .filters-bar select {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; color: var(--text); font-size: 0.9rem; min-width: 180px;
      cursor: pointer;
    }
    .filters-bar select:focus { outline: none; border-color: var(--accent); }

    .btn-recalc {
      background: var(--accent); color: var(--bg); border: none; border-radius: 8px;
      padding: 10px 18px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-recalc:hover { opacity: 0.85; }
    .btn-recalc:active { transform: scale(0.97); }
    .btn-recalc:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Summary cards */
    .summary-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px; margin-bottom: 24px;
    }
    .summary-card {
      background: var(--bg-surface); border-radius: 12px; padding: 16px; text-align: center;
    }
    .summary-card .value { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
    .summary-card .label { font-size: 0.8rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-card.red .value { color: var(--red); }
    .summary-card.yellow .value { color: var(--yellow); }
    .summary-card.blue .value { color: var(--blue); }
    .summary-card.green .value { color: var(--green); }
    .summary-card.accent .value { color: var(--accent); }

    /* Matéria sections */
    .materia-list { display: flex; flex-direction: column; gap: 8px; }

    .materia-card {
      background: var(--bg-surface); border-radius: 12px; overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .materia-card:hover { box-shadow: 0 0 0 1px var(--border); }

    .materia-header {
      display: flex; align-items: center; gap: 12px; padding: 16px 20px;
      cursor: pointer; user-select: none; transition: background 0.2s;
    }
    .materia-header:hover { background: var(--bg-elevated); }

    .materia-expand-icon {
      font-size: 0.75rem; color: var(--text-sub); transition: transform 0.3s ease;
      flex-shrink: 0; width: 16px; text-align: center;
    }
    .materia-card.expanded .materia-expand-icon { transform: rotate(90deg); }

    .materia-info { flex: 1; min-width: 0; }
    .materia-name { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .materia-meta { font-size: 0.78rem; color: var(--text-sub); }

    .materia-progress-wrap { width: 140px; flex-shrink: 0; }
    .materia-pct { font-size: 0.78rem; text-align: right; margin-top: 3px; font-weight: 600; }

    /* Topics */
    .materia-topics {
      max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s ease;
      background: var(--bg-surface); padding: 0 20px;
    }
    .materia-card.expanded .materia-topics {
      max-height: 2000px; padding: 12px 20px 16px;
    }

    .topic-row {
      display: flex; align-items: center; gap: 12px; padding: 10px 0;
      border-bottom: 1px solid var(--bg-elevated);
    }
    .topic-row:last-child { border-bottom: none; }

    .topic-name { flex: 1; font-size: 0.85rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topic-progress-wrap { width: 120px; flex-shrink: 0; }
    .topic-badge {
      font-size: 0.7rem; padding: 3px 8px; border-radius: 10px; font-weight: 600;
      white-space: nowrap; flex-shrink: 0;
    }
    .topic-date { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }

    /* Responsive */
    @media (max-width: 600px) {
      .materia-header { padding: 12px 14px; flex-wrap: wrap; }
      .materia-progress-wrap { width: 100%; order: 3; margin-top: 8px; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .topic-row { flex-wrap: wrap; gap: 6px; }
      .topic-progress-wrap { width: 100%; order: 3; }
      .topic-date { display: none; }
      .filters-bar { flex-direction: column; align-items: stretch; }
      .filters-bar select { min-width: unset; width: 100%; }
    }
  </style>
</head>
<body>
  <a href="#page-content" class="skip-link">Pular para conteúdo</a>
  <div class="header">
    <h1>📈 Domínio do Edital</h1>
  </div>

  <main id="page-content" role="main">
  <div class="filters-bar">
    <select id="filter-edital" aria-label="Filtrar por edital">
      <option value="">Todos os editais</option>
    </select>
    <select id="filter-cargo" aria-label="Filtrar por cargo">
      <option value="">Todos os cargos</option>
    </select>
    <button class="btn-recalc" id="btn-recalcular" type="button">🔄 Recalcular</button>
  </div>

  <div class="summary-grid" id="summary-grid">
    <div class="summary-card accent">
      <div class="value" id="sum-topics">—</div>
      <div class="label">Total Tópicos</div>
    </div>
    <div class="summary-card accent">
      <div class="value" id="sum-avg">—</div>
      <div class="label">Média Geral</div>
    </div>
    <div class="summary-card red">
      <div class="value" id="sum-red">—</div>
      <div class="label">Não Dominado</div>
    </div>
    <div class="summary-card yellow">
      <div class="value" id="sum-yellow">—</div>
      <div class="label">Em Progresso</div>
    </div>
    <div class="summary-card blue">
      <div class="value" id="sum-blue">—</div>
      <div class="label">Dominado</div>
    </div>
    <div class="summary-card green">
      <div class="value" id="sum-green">—</div>
      <div class="label">Consolidado</div>
    </div>
  </div>

  <div id="materia-container">
    <div class="loading-state" id="loading-state">
      <div class="spinner"></div>
      <p>Carregando dados de domínio...</p>
    </div>
  </div>

  </main>

  <script src="/auth-interceptor.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/timer-global.js"></script>
  <script type="module" src="/js/pages/mastery.js"></script>
</body>
</html>
