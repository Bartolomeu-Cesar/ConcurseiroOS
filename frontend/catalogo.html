<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Catálogo — ConcurseiroOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e1e2e">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .header { flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 1.5rem; }
    .filters-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .filters-bar select, .filters-bar input {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; color: var(--text); font-size: 0.9rem;
    }
    .filters-bar input { flex: 1; min-width: 180px; }
    .catalogo-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .catalogo-card {
      background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; display: flex; flex-direction: column; gap: 8px; overflow: hidden;
    }
    .catalogo-card .cat-tipo {
      font-size: 0.7rem; padding: 3px 10px; border-radius: 10px; font-weight: 600;
      background: var(--bg-elevated); color: var(--accent); align-self: flex-start;
    }
    .catalogo-card .cat-titulo { font-size: 1rem; font-weight: 700; color: var(--text); min-width: 0; overflow: hidden; }
    .catalogo-card .cat-desc { font-size: 0.82rem; color: var(--text-sub, #9399b2); flex: 1; }
    .catalogo-card .cat-meta { font-size: 0.72rem; color: var(--text-muted, #6c7086); display: flex; justify-content: space-between; }
    .catalogo-card button {
      background: var(--accent); color: var(--bg); border: none; border-radius: 8px;
      padding: 9px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-top: 4px;
    }
    .catalogo-card button:disabled { opacity: 0.6; cursor: wait; }
    .empty { text-align: center; color: var(--text-sub, #9399b2); padding: 40px 20px; }
    @media (max-width: 600px) {
      .catalogo-grid { grid-template-columns: 1fr; }
      .filters-bar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <a href="#page-content" class="skip-link">Pular para conteúdo</a>
  <div class="header">
    <h1>📚 Catálogo de Materiais</h1>
    <button class="btn-recalc" onclick="abrirPublicar()" style="background:#94e2d5;color:#1e1e2e;border:none;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer;">📤 Publicar meu material</button>
  </div>

  <main id="page-content" role="main">
  <p style="color:var(--text-sub,#9399b2);font-size:0.9rem;margin-bottom:16px;">
    Materiais curados pela equipe e pela comunidade — editais verticalizados, cadernos de questões, decks de flashcards, leis e súmulas. Avalie com estrelas e importe direto para sua conta! 🚀
  </p>

  <div class="filters-bar">
    <input type="text" id="busca" placeholder="🔍 Buscar material..." aria-label="Buscar material" onkeyup="if(event.key==='Enter')aplicarFiltros()">
    <select id="filtro-categoria" aria-label="Filtrar por categoria" onchange="aplicarFiltros()"><option value="">Todas as categorias</option></select>
    <select id="filtro-tipo" aria-label="Filtrar por tipo" onchange="aplicarFiltros()">
      <option value="">Todos os tipos</option>
      <option value="edital">📋 Editais</option>
      <option value="caderno">📓 Cadernos</option>
      <option value="vademecum">📜 Vade Mécum</option>
      <option value="deck_flashcards">🧠 Flashcards</option>
      <option value="deck_questoes">❓ Questões</option>
      <option value="deck_sumulas">⚖️ Súmulas</option>
    </select>
    <select id="filtro-ordenar" aria-label="Ordenar por" onchange="aplicarFiltros()">
      <option value="avaliacao">⭐ Mais bem avaliados</option>
      <option value="downloads">⬇️ Mais baixados</option>
      <option value="recente">🆕 Mais recentes</option>
    </select>
  </div>

  <div class="catalogo-grid" id="catalogo-grid">
    <div class="empty">Carregando catálogo...</div>
  </div>

  </main>

  <script src="/auth-interceptor.js"></script>
  <script src="/sidebar.js"></script>
  <script src="/timer-global.js"></script>
  <script type="module" src="/js/pages/catalogo.js"></script>
  <script type="module">
    import { confirmModal, alertModal, promptModal } from '/js/modules/utils.js';
    import { toast } from '/js/modules/toast.js';
    Object.assign(window, { confirmModal, alertModal, promptModal, toast });
  </script>
</body>
</html>
