<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background with subtle gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#181825"/>
    </linearGradient>
    <linearGradient id="cap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cba6f7"/>
      <stop offset="100%" style="stop-color:#b4befe"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg-grad)"/>

  <!-- Graduation cap - larger and centered -->
  <g transform="translate(256, 200)">
    <!-- Cap base (diamond shape) -->
    <polygon points="0,-80 150,0 0,35 -150,0" fill="url(#cap-grad)"/>
    <!-- Cap top highlight -->
    <polygon points="0,-80 150,0 0,-15 -150,0" fill="#b4befe" opacity="0.4"/>
    <!-- Tassel button on top -->
    <line x1="0" y1="-80" x2="0" y2="-100" stroke="#f9e2af" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-104" r="8" fill="#f9e2af"/>
    <!-- Tassel hanging right -->
    <path d="M0,-80 Q35,-60 45,10 Q47,35 42,60" stroke="#f9e2af" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="42" cy="64" r="8" fill="#f9e2af"/>
    <!-- Board bottom edges (the hanging part) -->
    <path d="M-80,15 L-80,70 Q0,100 80,70 L80,15" fill="none" stroke="#cba6f7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Open book below -->
  <g transform="translate(256, 360)">
    <!-- Left page -->
    <path d="M-8,-30 Q-50,-30 -75,-20 L-75,30 Q-50,20 -8,22 Z" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <!-- Right page -->
    <path d="M8,-30 Q50,-30 75,-20 L75,30 Q50,20 8,22 Z" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <!-- Spine -->
    <path d="M-8,-30 Q0,-35 8,-30 L8,22 Q0,25 -8,22 Z" fill="#89b4fa" opacity="0.3"/>
    <!-- Text lines left -->
    <line x1="-60" y1="-10" x2="-20" y2="-10" stroke="#9399b2" stroke-width="2" stroke-linecap="round"/>
    <line x1="-60" y1="0" x2="-25" y2="0" stroke="#9399b2" stroke-width="2" stroke-linecap="round"/>
    <line x1="-60" y1="10" x2="-30" y2="10" stroke="#9399b2" stroke-width="2" stroke-linecap="round"/>
    <!-- Text lines right -->
    <line x1="20" y1="-10" x2="60" y2="-10" stroke="#9399b2" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="0" x2="60" y2="0" stroke="#9399b2" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="10" x2="60" y2="10" stroke="#9399b2" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- App name -->
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#cdd6f4">ConcurseiroOS</text>
  <text x="256" y="485" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#9399b2">Estudos para Concursos</text>
</svg>
