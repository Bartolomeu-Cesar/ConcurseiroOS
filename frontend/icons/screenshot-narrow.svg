<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <rect width="390" height="844" fill="#1e1e2e"/>
  <!-- Status bar -->
  <rect x="0" y="0" width="390" height="44" fill="#181825"/>
