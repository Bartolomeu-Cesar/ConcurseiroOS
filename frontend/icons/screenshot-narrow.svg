  <!-- Questões section -->
  <rect x="16" y="356" width="358" height="160" rx="16" fill="#313244"/>
  <text x="36" y="388" font-family="sans-serif" font-size="14" fill="#89b4fa" font-weight="600">❓ Questões do Dia</text>
