  <!-- Flashcard area -->
  <rect x="16" y="116" width="358" height="220" rx="16" fill="#313244"/>
  <text x="36" y="148" font-family="sans-serif" font-size="14" fill="#89b4fa" font-weight="600">🧠 Revisão de Hoje</text>
  <!-- Progress bar -->
  <rect x="36" y="164" width="318" height="8" rx="4" fill="#45475a"/>
