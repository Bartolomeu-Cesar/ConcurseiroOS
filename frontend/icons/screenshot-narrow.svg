  <rect x="16" y="536" width="358" height="100" rx="16" fill="#313244"/>
  <text x="36" y="566" font-family="sans-serif" font-size="14" fill="#89b4fa" font-weight="600">📊 Hoje</text>
  <text x="36" y="598" font-family="sans-serif" font-size="24" fill="#a6e3a1" font-weight="700">3.5h</text>
  <text x="120" y="598" font-family="sans-serif" font-size="24" fill="#89b4fa" font-weight="700">28q</text>
  <text x="200" y="598" font-family="sans-serif" font-size="24" fill="#cba6f7" font-weight="700">15f</text>
  <text x="280" y="598" font-family="sans-serif" font-size="24" fill="#f9e2af" font-weight="700">🔥12</text>
  <!-- Bottom nav -->
  <rect x="0" y="780" width="390" height="64" fill="#313244"/>
  <text x="48" y="818" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">📖</text>
  <text x="48" y="832" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9399b2">PDFs</text>
