  <text x="56" y="430" font-family="sans-serif" font-size="12" fill="#cdd6f4">De acordo com a CF/88, art. 5º,</text>
  <text x="56" y="448" font-family="sans-serif" font-size="12" fill="#cdd6f4">é correto afirmar que...</text>
  <text x="56" y="472" font-family="sans-serif" font-size="11" fill="#a6e3a1">● a) Todos são iguais perante a lei</text>
  <rect x="36" y="492" width="100" height="14" rx="7" fill="#a6e3a1" opacity="0.3"/>
