  <text x="130" y="832" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9399b2">Questões</text>
  <text x="210" y="818" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cba6f7">🧠</text>
  <text x="210" y="832" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#cba6f7">Flash</text>
  <text x="290" y="818" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">📊</text>
  <text x="290" y="832" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9399b2">Dash</text>
  <text x="350" y="818" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">☰</text>
  <text x="350" y="832" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9399b2">Mais</text>
