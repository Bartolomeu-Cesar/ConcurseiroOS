version: '3.8'

# =============================================================
# ConcurseiroOS — Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# =============================================================

services:
  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.27-alpine
    container_name: concurseiro-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro        # SSL certs (mount your own)
      - ./frontend:/usr/share/nginx/frontend:ro  # Static files served directly
    depends_on:
      app:
        condition: service_healthy
    networks:
      - frontend_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Application Backend (FastAPI + Uvicorn) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: "2.4.0"
        BUILD_DATE: "${BUILD_DATE:-2026-08-22}"
        VCS_REF: "${VCS_REF:-main}"
    container_name: concurseiro-app
    expose:
      - "8000"
    volumes:
      - app-data:/data
      - app-pdfs:/data/pdfs
      - app-backups:/data/backups
    environment:
      # --- Core ---
      - ENV=production
      - DB_PATH=/data/progress.db
      - BACKUP_DIR=/data/backups
      - PDF_ROOT=/data/pdfs
      - BACKUP_AUTO=true
      - BACKUP_MAX_KEEP=7
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # --- Auth (REQUIRED in production) ---
      - AUTH_ENABLED=true
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - JWT_EXPIRE_HOURS=72
      - DEFAULT_PLAN=free
      # --- Email ---
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_USE_TLS=true
      # --- AI Tutor ---
      - AI_PROVIDER=${AI_PROVIDER:-auto}
      - AI_MODEL=${AI_MODEL}
      - AI_DAILY_TOKEN_LIMIT=${AI_DAILY_TOKEN_LIMIT:-50000}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # --- Push Notifications ---
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@concurseiroos.app}
    networks:
      - frontend_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

networks:
  frontend_net:
    driver: bridge

volumes:
  app-data:
    driver: local
  app-pdfs:
    driver: local
  app-backups:
    driver: local
