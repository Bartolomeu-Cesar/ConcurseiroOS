name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v "psycopg2-binary" backend/requirements.txt | pip install -r /dev/stdin
          pip install ruff==0.16.3 pytest

      - name: Lint with ruff
        run: ruff check backend/

      - name: Run tests
        run: pytest backend/tests/ -q --tb=short
        env:
          AUTH_ENABLED: "false"

      - name: Test summary
        if: always()
        run: pytest backend/tests/ --co -q 2>/dev/null | tail -1 || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: concurseiroos:test
          build-args: |
            APP_VERSION=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container starts
        run: |
          docker run -d --name test-app \
            -e AUTH_ENABLED=false \
            -p 8000:8000 \
            concurseiroos:test
          sleep 5
          curl -f http://localhost:8000/api/health || (docker logs test-app && exit 1)
          docker stop test-app
